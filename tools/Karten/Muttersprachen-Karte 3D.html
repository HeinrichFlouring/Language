// ── HILFSFUNKTIONEN ──
function latLonToVec3(lat, lon, radius) {
    const phi = (90 - lat) * (Math.PI / 180);
    const theta = (lon + 180) * (Math.PI / 180);
    return new THREE.Vector3(
        -radius * Math.sin(phi) * Math.cos(theta),
         radius * Math.cos(phi),
         radius * Math.sin(phi) * Math.sin(theta)
    );
}

function hue(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return Math.abs(h)%360;}
function col(s,a=1){return`hsla(${hue(s)},78%,60%,${a})`;}
function ints(p){

function domSp(data){
  if(!data)return null;
  let best=null,bp=0;
  for(const[s,v]of Object.entries(data))if((v.p||0)>bp){bp=v.p;best=s;}
  return best;
}

// // ── Dreiecke unterteilen & auf Kugel projizieren (gegen "Durchsacken") ──
function subdivideAndProject(positions, indices, radius, maxEdge) {
    let pos = positions;
    let idx = indices;
    const maxEdgeSq = maxEdge * maxEdge;

    for (let pass = 0; pass < 8; pass++) {
        const midCache = new Map();
        const newIdx = [];
        let subdivided = false;

        const getMid = (a, b) => {
            const key = a < b ? a + '_' + b : b + '_' + a;
            if (midCache.has(key)) return midCache.get(key);
            let mx = (pos[a*3] + pos[b*3]) / 2;
            let my = (pos[a*3+1] + pos[b*3+1]) / 2;
            let mz = (pos[a*3+2] + pos[b*3+2]) / 2;
            const l = Math.sqrt(mx*mx + my*my + mz*mz) || 1;
            const i = pos.length / 3;
            pos.push(mx/l*radius, my/l*radius, mz/l*radius); // auf Kugel projizieren!
            midCache.set(key, i);
            return i;
        };
        const eSq = (a, b) => {
            const dx = pos[a*3]-pos[b*3], dy = pos[a*3+1]-pos[b*3+1], dz = pos[a*3+2]-pos[b*3+2];
            return dx*dx + dy*dy + dz*dz;
        };

        for (let i = 0; i < idx.length; i += 3) {
            const a = idx[i], b = idx[i+1], c = idx[i+2];
            if (eSq(a,b) > maxEdgeSq || eSq(b,c) > maxEdgeSq || eSq(c,a) > maxEdgeSq) {
                subdivided = true;
                const ab = getMid(a,b), bc = getMid(b,c), ca = getMid(c,a);
                newIdx.push(a,ab,ca,  ab,b,bc,  ca,bc,c,  ab,bc,ca);
            } else {
                newIdx.push(a, b, c);
            }
        }
        idx = newIdx;
        if (!subdivided) break;
    }
    return { positions: pos, indices: idx };
}
    
function createCountryGeometry(geojsonGeom, radius) {
    const allPositions = [];
    const allIndices = [];
    let vertexOffset = 0;

    // Einzelnen Ring (outer ODER hole) triangulieren und zum Gesamt-Mesh hinzufügen
    const processRing = (ring) => {
        if (!ring || ring.length < 3) return;

        const coords = [];
        for (let i = 0; i < ring.length; i++) {
            coords.push([ring[i][0], ring[i][1]]);
        }
        // Geschlossenen Ring normalisieren
        if (coords.length > 1 &&
            coords[0][0] === coords[coords.length - 1][0] &&
            coords[0][1] === coords[coords.length - 1][1]) {
            coords.pop();
        }
        if (coords.length < 3) return;

        // Zentrum DIESES Rings für tangentiale Ebene
        let cLat = 0, cLon = 0;
        for (const [lon, lat] of coords) { cLon += lon; cLat += lat; }
        cLon /= coords.length;
        cLat /= coords.length;
        const center3D = latLonToVec3(cLat, cLon, radius);

        // Lokale Basisvektoren
        const up = center3D.clone().normalize();
        let east = new THREE.Vector3(0, 1, 0).cross(up).normalize();
        if (east.length() < 0.001) {
            east = new THREE.Vector3(1, 0, 0).cross(up).normalize();
        }
        const north = up.clone().cross(east).normalize();

        // Projektion auf Ebene + 3D-Vertices
        const flat = [];
        const verts3D = [];
        for (const [lon, lat] of coords) {
            const v = latLonToVec3(lat, lon, radius);
            const toV = v.clone().sub(center3D);
            flat.push(toV.dot(east), toV.dot(north));
            verts3D.push(v.x, v.y, v.z);
        }

        if (flat.length < 6) return;
        const indices = earcut(flat);
        if (!indices || indices.length === 0) return;

        allPositions.push(...verts3D);
        for (let i = 0; i < indices.length; i++) {
            allIndices.push(indices[i] + vertexOffset);
        }
        vertexOffset += verts3D.length / 3;
    };

    // Polygon besteht aus [outerRing, hole1, hole2, ...]
    // Wir füllen ALLE Ringe. Die inneren überdecken die "Löcher".
    const processPolygon = (polygon) => {
        if (!polygon) return;
        for (let i = 0; i < polygon.length; i++) {
            processRing(polygon[i]);
        }
    };

    if (geojsonGeom.type === 'Polygon') {
        processPolygon(geojsonGeom.coordinates);
    } else if (geojsonGeom.type === 'MultiPolygon') {
        geojsonGeom.coordinates.forEach(polygon => processPolygon(polygon));
    }

        if (allPositions.length === 0) return null;

    // Große Dreiecke unterteilen, damit sie der Kugelkrümmung folgen
    const refined = subdivideAndProject(allPositions, allIndices, radius, 0.16);

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(refined.positions, 3));
    geometry.setIndex(refined.indices);

    // Radiale Normals
    const posArr = geometry.attributes.position.array;
    const normArr = new Float32Array(posArr.length);
    for (let i = 0; i < posArr.length; i += 3) {
        const x = posArr[i], y = posArr[i + 1], z = posArr[i + 2];
        const len = Math.sqrt(x * x + y * y + z * z) || 1;
        normArr[i] = x / len;
        normArr[i + 1] = y / len;
        normArr[i + 2] = z / len;
    }
    geometry.setAttribute('normal', new THREE.BufferAttribute(normArr, 3));

    return geometry;
}

// ── GRENZLINIEN (nur äußere Ringe) ──
function createBorderLines(geojsonGeom, radius) {
    const lines = [];
    const processRing = (ring) => {
        const len = ring.length;
        if (len < 2) return;
        const max = (len > 1 && ring[0][0] === ring[len-1][0] && ring[0][1] === ring[len-1][1]) ? len - 1 : len;
        const pts = [];
        for (let i = 0; i < max; i++) {
            const [lon, lat] = ring[i];
            const v = latLonToVec3(lat, lon, radius + 0.012); 
            pts.push(v.x, v.y, v.z);
        }
        if (pts.length < 6) return;
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
        lines.push(new THREE.LineLoop(geo, new THREE.LineBasicMaterial({ 
            color: 0x1a2d45, 
            transparent: true, 
            opacity: 0.5 
        })));
    };
    
    if (geojsonGeom.type === 'Polygon') {
        processRing(geojsonGeom.coordinates[0]); // nur outer ring
    } else if (geojsonGeom.type === 'MultiPolygon') {
        geojsonGeom.coordinates.forEach(polygon => processRing(polygon[0])); // nur outer ring
    }
    return lines;
}

    });
}

// ── FARBLOGIK ──
function colorAll() {
    countryMeshes.forEach(mesh => {
        const data = getCountryData(mesh);
        const mat = mesh.material;
        const iso = mesh.userData.iso;

        if (curSp) {
            const m = data && data[curSp];
            if (m) {
                mat.color.set(col(curSp, ints(m.p)));
                mat.opacity = 1;
            } else {
                mat.color.set('#3d6494');
                mat.opacity = 1;
            }
        } else if (curLand && iso === curLand) {
            const sp = domSp(data);
            mat.color.set(sp ? col(sp, 0.9) : '#4a7ab5');
            mat.opacity = 1;
        } else {
            mat.color.set('#3d6494');
            mat.opacity = 1;
        }
        mat.transparent = mat.opacity < 1;
        mesh.userData.baseColor = mat.color.getHex();
    });
}

// ── RAYCASTER ──
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredMesh = null;

function onPointerMove(e) {
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects([...countryMeshes, earth]);
    const camDir = camera.position.clone().normalize();
    const landHit = hits.find(h => {
        if (h.object === earth) return false;
        const hitDir = h.point.clone().normalize();
        return hitDir.dot(camDir) > 0.15;
    });

    if (landHit) {
        const obj = landHit.object;
        if (hoveredMesh !== obj) {
            if (hoveredMesh) hoveredMesh.material.color.setHex(hoveredMesh.userData.baseColor || 0x3d6494);
            hoveredMesh = obj;
            const base = hoveredMesh.userData.baseColor || 0x3d6494;
            const c = new THREE.Color(base);
            c.offsetHSL(0, 0, 0.12);
            hoveredMesh.material.color.copy(c);
        }
        document.body.style.cursor = 'pointer';
        showTT(e, getCountryData(obj), obj.userData.name);
    } else {
        if (hoveredMesh) {
            hoveredMesh.material.color.setHex(hoveredMesh.userData.baseColor || 0x3d6494);
            hoveredMesh = null;
        }
        document.body.style.cursor = 'default';
        hideTT();
    }
}

function onClick(e) {
    if (e.target.closest('#sb') || e.target.closest('#hdr') || e.target.closest('#zc')) return;

    const rect = renderer.domElement.getBoundingClientRect();
    const clickMouse = new THREE.Vector2();
    clickMouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    clickMouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

    raycaster.setFromCamera(clickMouse, camera);
    const hits = raycaster.intersectObjects([...countryMeshes, earth]);
    const camDir = camera.position.clone().normalize();
    const landHit = hits.find(h => {
        if (h.object === earth) return false;
        const hitDir = h.point.clone().normalize();
        return hitDir.dot(camDir) > 0.15;
    });

    if (landHit) {
        const obj = landHit.object;
        curLand = obj.userData.iso;
        colorAll();
        showSB(getCountryData(obj), obj.userData.name);
    }
}

renderer.domElement.addEventListener('mousemove', onPointerMove);
renderer.domElement.addEventListener('click', onClick);

// ── TOOLTIP ──
const tt = document.getElementById('tt');
function posTT(e) {
    const r = document.getElementById('mw').getBoundingClientRect();
    let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
    if (x + 310 > r.width) x = e.clientX - r.left - 315;
    if (y + 220 > r.height) y = e.clientY - r.top - 220;
    tt.style.left = x + 'px'; tt.style.top = y + 'px';
}
function showTT(e, data, name) {
    const c = curSp ? col(curSp) : '#58a6ff';
    let h = `<h3 style="color:${c}">${name}</h3>`;
    if (curSp) {
        const m = data && data[curSp];
        if (m) {
            h += `<div class="tr"><span class="tl">Absolut:</span><span class="tv">${fN(m.a)}</span></div>`;
            h += `<div class="tr"><span class="tl">Prozent:</span><span class="tv">${fP(m.p)}</span></div>`;
            if (m.p) h += `<div class="tr"><span class="tl">Mehrheit:</span><span class="tv" style="color:${m.am ? '#3fb950' : m.rm ? '#f0883e' : '#8b949e'}">${m.am ? '✓ Absolut' : m.rm ? '~ Relativ' : '✗ Nein'}</span></div>`;
        } else {
            h += `<div style="color:#484f58;padding:4px 0">${curSp} wird hier nicht gesprochen</div>`;
        }
    } else if (data) {
        Object.entries(data).filter(([, v]) => v.p || v.a).sort((a, b) => (b[1].p || 0) - (a[1].p || 0)).slice(0, 5)
            .forEach(([s, v]) => h += `<div class="tr">
        <span class="tl" style="display:flex;align-items:center;gap:5px">
          <span style="width:8px;height:8px;border-radius:50%;background:${col(s)};display:inline-block;flex-shrink:0"></span>${s}
        </span><span class="tv">${fP(v.p)}</span></div>`);
        const n = Object.keys(data).length;
        if (n > 5) h += `<div style="color:#484f58;font-size:11px;margin-top:4px">+${n - 5} weitere…</div>`;
    } else {
        h += `<div style="color:#484f58">Keine Daten</div>`;
    }
    tt.innerHTML = h; tt.style.display = 'block'; posTT(e);
}
function hideTT() { tt.style.display = 'none'; }

// ── SIDEBAR ──
function showSB(data, name) {
    document.getElementById('sbt').textContent = name || 'Unbekannt';
    if (!data) { document.getElementById('sbc').innerHTML = `<div class="se">Keine Daten für ${name || '?'}</div>`; return; }
    let extra = '';
    if (curSp) {
        const m = data[curSp];
        extra = `<div style="padding:10px 12px;background:#21262d;border-bottom:1px solid #30363d">
      <div style="font-size:12px;color:#8b949e;margin-bottom:6px">${curSp} in ${name}</div>`;
        if (m) extra += `<div class="tr"><span class="tl">Absolut:</span><span class="tv">${fN(m.a)}</span></div>
      <div class="tr"><span class="tl">Prozent:</span><span class="tv">${fP(m.p)}</span></div>
      <div class="tr"><span class="tl">Mehrheit:</span><span class="tv" style="color:${m.am ? '#3fb950' : m.rm ? '#f0883e' : '#8b949e'}">${m.am ? '✓ Absolut' : m.rm ? '~ Relativ' : '✗ Nein'}</span></div>`;
        else extra += `<span style="color:#484f58">Nicht gesprochen</span>`;
        extra += '</div>';
    }
    document.getElementById('sbc').innerHTML = extra + buildTable(data);
    bindSort(data, extra);
}
function buildTable(data) {
    let rows = Object.entries(data).map(([s, v]) => { return { s, p: v.p || 0, a: v.a || 0 }; });
    rows.sort((a, b) => sortDi * (sortC === 's' ? a.s.localeCompare(b.s, 'de') : a[sortC] - b[sortC]));
    return `<table class="dt" id="lt"><thead><tr>
    <th data-c="s">Sprache</th>
    <th data-c="p" class="n desc">Prozent</th>
    <th data-c="a" class="n">Absolut</th>
    </tr></thead><tbody>${rows.map(r => `<tr>
      <td><div style="display:flex;align-items:center;gap:7px">
        <span style="width:10px;height:10px;border-radius:50%;background:${col(r.s)};flex-shrink:0;display:inline-block"></span>
        ${r.s}</div></td>
      <td class="n"><div class="bw"><div class="br" style="width:${Math.min(Math.max(r.p * 1.2, r.a ? 2 : 0), 80)}px;background:${col(r.s)}"></div>${fP(r.p)}</div></td>
      <td class="n">${fN(r.a)}</td>
    </tr>`).join('')}</tbody></table>`;
}
function bindSort(data, extra) {
    document.querySelectorAll('#lt th[data-c]').forEach(th => {
        th.addEventListener('click', () => {
            const c = th.dataset.c;
            if (sortC === c) sortDi *= -1; else { sortC = c; sortDi = c === 's' ? 1 : -1; }
            document.querySelectorAll('#lt th').forEach(t => t.classList.remove('asc', 'desc'));
            th.classList.add(sortDi === 1 ? 'asc' : 'desc');
            document.getElementById('sbc').innerHTML = extra + buildTable(data);
            bindSort(data, extra);
        });
    });
}

// ── SUCHE ──
const si = document.getElementById('si'), ac = document.getElementById('ac');
si.addEventListener('input', () => {
    const q = si.value.trim().toLowerCase();
    if (!q) { ac.style.display = 'none'; return; }
    const m = D.sprachen.filter(s => s.toLowerCase().includes(q)).slice(0, 30);
    if (!m.length) { ac.style.display = 'none'; return; }
    ac.innerHTML = m.map(s => {
        const i = s.toLowerCase().indexOf(q);
        return `<div class="ai" data-s="${s}">${s.slice(0, i)}<span class="ahi">${s.slice(i, i + q.length)}</span>${s.slice(i + q.length)}</div>`;
    }).join('');
    ac.style.display = 'block';
    ac.querySelectorAll('.ai').forEach(x => x.addEventListener('click', () => selectSp(x.dataset.s)));
});
si.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        const q = si.value.trim().toLowerCase();
        const m = D.sprachen.find(s => s.toLowerCase() === q) || D.sprachen.find(s => s.toLowerCase().startsWith(q));
        if (m) selectSp(m); ac.style.display = 'none';
    }
    if (e.key === 'Escape') ac.style.display = 'none';
});
document.addEventListener('click', e => { if (!e.target.closest('#sw')) ac.style.display = 'none'; });

function selectSp(sp) {
    curSp = sp; curLand = null; si.value = sp; ac.style.display = 'none';
    const entries = D.sprach_data[sp] || [];
    const total = entries.reduce((s, e) => s + (e.a || 0), 0);
    document.getElementById('leg').innerHTML =
        `<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${col(sp)};flex-shrink:0"></span>` +
        `<span>${sp}: ${entries.length} Länder/Gebiete · ${fN(total)} Sprecher gesamt</span>`;
    document.getElementById('sbt').textContent = sp + ' – alle Länder';
    const sorted = [...entries].sort((a, b) => (b.p || 0) - (a.p || 0) || (b.a || 0) - (a.a || 0));
    document.getElementById('sbc').innerHTML = `<table class="dt"><thead><tr>
    <th>Land</th><th class="n desc">Prozent</th><th class="n">Absolut</th>
    </tr></thead><tbody>${sorted.map(e => `<tr>
      <td>${e.land}</td>
      <td class="n"><div class="bw"><div class="br" style="width:${Math.min(Math.max((e.p || 0) * 1.2, 2), 80)}px;background:${col(sp)}"></div>${fP(e.p)}</div></td>
      <td class="n">${fN(e.a)}</td>
    </tr>`).join('')}</tbody></table>`;
    colorAll();
}

// ── RESET ──
document.getElementById('bc').onclick = () => {
    curSp = null; curLand = null; si.value = '';
    document.getElementById('leg').innerHTML = '';
    document.getElementById('sbt').textContent = 'Informationen';
    document.getElementById('sbc').innerHTML = '<div class="se">← Klicke auf ein Land<br>oder suche eine Sprache</div>';
    controls.reset();
    camera.position.set(0, 0, 18);
    colorAll();
};

// ── ZOOM BUTTONS (3D) ──
document.getElementById('zi').onclick = () => {
    const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
    camera.position.addScaledVector(dir, -2);
};
document.getElementById('zo').onclick = () => {
    const dir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
    camera.position.addScaledVector(dir, 2);
};
document.getElementById('zr').onclick = () => {
    controls.reset();
    camera.position.set(0, 0, 18);
};

// ── RESIZE ──
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── ANIMATION ──
function animate() {
    requestAnimationFrame(animate);
    earthGroup.rotation.y += 0.0008;
    controls.update();
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
